mode: full_localization
seed: 20260904

system:
  carrier_hz: 3.5e9
  upa_shape: [4, 4]
  rf_observation: [range, azimuth, elevation]
  camera: onboard_monocular_rgb
  target: vehicle_mounted_ue
  shared_pose_uncertainty: true

f0:
  output_root: data/full_localization
  frames_per_sequence: 400
  airsim_host: 127.0.0.1
  airsim_port: 41451
  airsim_gpu: 0
  maximum_rgb_segmentation_delta_s: 0.02
  minimum_candidate_box_area_px2: 40.0
  sequence_splits:
    calibration: [seq00, seq01]
    validation: [seq02, seq03]
    test: [seq04, seq05, seq06, seq07, seq08, seq09, seq10, seq11]
  sequence_profiles:
    seq00: {altitude_m: 35.0, horizontal_m: 14.0, bearing_deg: 0.0, hard_fraction: 0.25}
    seq01: {altitude_m: 50.0, horizontal_m: 22.0, bearing_deg: 90.0, hard_fraction: 0.50}
    seq02: {altitude_m: 35.0, horizontal_m: 18.0, bearing_deg: 180.0, hard_fraction: 0.25}
    seq03: {altitude_m: 50.0, horizontal_m: 26.0, bearing_deg: 270.0, hard_fraction: 0.50}
    seq04: {altitude_m: 30.0, horizontal_m: 12.0, bearing_deg: 30.0, hard_fraction: 0.25}
    seq05: {altitude_m: 40.0, horizontal_m: 18.0, bearing_deg: 75.0, hard_fraction: 0.50}
    seq06: {altitude_m: 50.0, horizontal_m: 24.0, bearing_deg: 120.0, hard_fraction: 0.75}
    seq07: {altitude_m: 60.0, horizontal_m: 30.0, bearing_deg: 330.0, hard_fraction: 0.25}
    seq08: {altitude_m: 35.0, horizontal_m: 16.0, bearing_deg: 210.0, hard_fraction: 0.50}
    seq09: {altitude_m: 45.0, horizontal_m: 22.0, bearing_deg: 255.0, hard_fraction: 0.75}
    seq10: {altitude_m: 55.0, horizontal_m: 28.0, bearing_deg: 300.0, hard_fraction: 0.50}
    seq11: {altitude_m: 65.0, horizontal_m: 34.0, bearing_deg: 345.0, hard_fraction: 0.75}
  detector:
    source_dataset: /home/xwl/.cache/kagglehub/datasets/banuprasadb/visdrone-dataset/versions/1/VisDrone_Dataset
    converted_dataset: data/visdrone_obb
    base_model: yolo11n-obb.pt
    target_pattern: '^model\.(13|16|17|19|20|22|23)\.(?!dfl)'
    rank: 4
    alpha: 8
    dropout: 0.05
    learning_rate: 0.001
    device: 1
    image_size_px: 640
    epochs: 20
    training_fraction: 1.0
    batch_size: 32
    workers: 8
    patience: 5
    seed: 20260904
    runs_dir: runs/full_localization_lora
    merged_checkpoint: checkpoints/full_localization_lora.pt

f1:
  calibration_sequences: [seq00, seq01]
  validation_sequences: [seq02, seq03]
  detector_device: 1
  detector_image_size_px: 640
  detector_batch_size: 64
  detector_confidence: 0.05
  detector_nms_iou: 0.30
  detector_vehicle_class_ids: [9, 10]
  calibration_minimum_iou: 0.10
  covariance_floor_px2: 1.0
  c1_ridge_alpha: 1.0
  negligible_nll_improvement: 0.01

f2:
  altitude_m: [30, 45, 60, 75, 90, 105, 120]
  horizontal_distance_m: [20, 40, 60, 80, 100, 120, 140, 160, 180, 200]
  range_std_m: [0.5, 1.0, 2.0, 4.0]
  aoa_std_deg: [0.25, 0.5, 1.0, 2.0]
  attitude_std_deg: [0.05, 0.0889139705, 0.1581138830, 0.2811706626, 0.5]
  nominal_range_std_m: 1.0
  nominal_aoa_std_deg: 1.0
  nominal_attitude_std_deg: 0.2
  pose_position_std_m: 0.2
  position_covariance_sensitivity_scale: 4.0
  camera:
    width_px: 640
    height_px: 480
    fx_px: 320.0
    fy_px: 320.0
    cx_px: 320.0
    cy_px: 240.0
  camera_rotation_body:
    [[0.0, -0.7071067811865476, 0.7071067811865476],
     [1.0, 0.0, 0.0],
     [0.0, 0.7071067811865476, 0.7071067811865476]]
  gate:
    minimum_reference_peb_gain: 0.10
    minimum_reference_zeb_gain: 0.10
    minimum_reference_cells: 8
    minimum_robust_gain_at_max_attitude: 0.05
    minimum_robust_cells_at_max_attitude: 4
    minimum_altitudes_spanned: 3
    minimum_distances_spanned: 3

f3:
  representative_geometries: 8
  monte_carlo_trials: 500
  coverage_confidence: 0.95
  selection_rule: gain_quantiles_with_spatial_diversity
  parallel_workers: 4
  optimizer:
    max_function_evaluations: 250
    gradient_tolerance: 1.0e-10
    parameter_tolerance: 1.0e-10
    cost_tolerance: 1.0e-10
  gate:
    minimum_improved_geometries: 6
    minimum_gain_spearman: 0.0
    nees_mean_range: [0.5, 8.0]
    noncatastrophic_coverage_range: [0.75, 1.0]

f4:
  detector_device: 2
  detector_batch_size: 8
  rf_gate_confidence: 0.99
  rf_seed: 20260944
  rf_range_std_m: 1.0
  rf_aoa_std_deg: 1.0
  pose_position_std_m: 0.2
  pose_attitude_std_deg: 0.2
  visual_tracker_process_std_px: 3.0
  visual_tracker_measurement_std_px: 2.0
  visual_tracker_gate_confidence: 0.99
  visual_tracker_max_missed_frames: 5
  hard_subset_rule: nonserved_candidate_inside_rf_gate
  subset_candidate_minimum_iou: 0.10
  gate:
    require_hard_rf_accuracy_above_visual: true

f5:
  subcarrier_count: 32
  subcarrier_spacing_hz: 480000.0
  snr_db: [-15, -10, -5, 0, 5, 10]
  waveform_realizations: 200
  estimator_batch_size: 20
  nominal_snr_db: 0
  range_grid_m: [10.0, 250.0, 0.1]
  azimuth_grid_deg: [-90.0, 90.0, 0.5]
  elevation_grid_deg: [-75.0, 75.0, 0.5]
  gate:
    minimum_error_snr_spearman_magnitude: 0.8
    require_high_snr_better_than_low_snr: true

f6:
  scene_asset: data/sionna_rt/full_localization_scene.xml
  gpu: 3
  target_height_m: 1.5
  los_max_depth: 0
  multipath_max_depth: 3
  mild_multipath_reflection_order: 1
  samples_per_source: 10000
  max_paths_per_source: 256
  synthetic_array: true
  path_truth_firewall: true
  gate_a:
    minimum_error_snr_spearman_magnitude: 0.8
    nominal_rmse_ratio_range: [0.5, 2.0]
  gate_b:
    require_positive_aggregate_3d_gain: true
    require_positive_aggregate_z_gain: true

f7:
  test_sequences: [seq04, seq05, seq06, seq07, seq08, seq09, seq10, seq11]
  rf_seeds: [20260971, 20260972, 20260973, 20260974, 20260975]
  waveform_model: analytic_los
  waveform_snr_db: 0.0
  waveform_batch_size: 20
  parallel_workers: 4
  association_confidence: 0.99
  bootstrap_resamples: 10000
  bootstrap_seed: 20260976
  bootstrap_unit: sequence
  coverage_confidence: 0.95
  primary_methods: [rf_only_full_3d, rf_vision_shared_pose]
  ablations: [rf_vision_no_pose_uncertainty, range_azimuth_vision]

f8:
  minimum_3d_rmse_reduction: 0.15
  require_positive_95ci_lower_bound: true
  target_z_rmse_reduction: 0.10
  preferred_coverage_range: [0.90, 0.98]
  target_hard_association_accuracy: 0.90

outputs:
  root: results/full_localization
  progress: docs/FULL_LOCALIZATION_PROGRESS.md
  data_freeze: docs/FULL_LOCALIZATION_DATA_FREEZE.md
  visual_calibration: docs/FULL_VISUAL_CALIBRATION.md
  final_freeze: docs/FULL_LOCALIZATION_FREEZE.md
  final_report: docs/FULL_LOCALIZATION_REPORT.md
